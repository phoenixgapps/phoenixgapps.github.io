<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[DEVELOPER NAME] – Android apps</title>
<style>
  :root { color-scheme: light dark; --text: #1b1f26; --muted: #4a5260; --accent: #0d5eaf; --bg: #f8f9ff; --card: #ffffff; --line: #dfe3ec; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e1e4ec; --muted: #b2b8c4; --accent: #9ccaff; --bg: #10141b; --card: #1a1f28; --line: #2c3340; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 56px; }
  h1 { font: 700 32px/1.25 Georgia, serif; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .app { display: flex; gap: 20px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
         border-radius: 20px; padding: 20px; }
  .app img { width: 88px; height: 88px; border-radius: 22px; flex: none; }
  .app h2 { font: 700 21px/1.3 Georgia, serif; margin: 0 0 6px; }
  .app p { margin: 0 0 10px; }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 15px; }
  @media (max-width: 480px) { .app { flex-direction: column; } }
</style>
</head>
<body>
<main>
<h1>[DEVELOPER NAME]</h1>
<p class="lead">Android apps</p>

<section class="app">
  <img src="images/subtitle-translator-gr.png" alt="">
  <div>
    <h2>Smart Subtitle Translator (GR)</h2>
    <p>Translates English subtitle files (.srt) into Greek, right on your phone. It works offline, and your subtitles
      never leave your phone.</p>
    <p><a href="privacy/subtitle-translator-gr.html">Privacy policy</a></p>
  </div>
</section>

<footer>Contact: [CONTACT EMAIL]</footer>
</main>
</body>
</html>
